<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Background Grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="320" x2="960" y2="320" />
    <line x1="0" y1="400" x2="960" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
  </g>

  <!-- Title & Subtitle -->
  <text x="480" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    JOBRIGHT PIPELINE ARCHITECTURE &amp; WORKFLOW
  </text>
  <text x="480" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    Autonomous local-first engine: Multi-source discovery to ATS-optimized application delivery
  </text>

  <!-- Connector Lines -->
  <!-- Step 1 to Step 2 -->
  <path d="M 200 160 L 255 160" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  
  <!-- Step 2 to Step 3 -->
  <path d="M 430 160 L 485 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Profile to AI Engine -->
  <path d="M 585 310 L 585 240" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Step 3 (Decision) to Reject (Down) -->
  <path d="M 540 235 L 540 350 L 445 350" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
  
  <!-- Step 3 (Decision) to Step 4 (Right - High Match) -->
  <path d="M 685 160 L 735 160" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Step 4 to Step 5 -->
  <path d="M 830 220 L 830 285" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CARDS -->

  <!-- CARD 1: Job Portals -->
  <g transform="translate(40, 100)">
    <rect width="160" height="120" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="10" fill="#1e293b" opacity="0.6"/>
    <text x="80" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">🌐 1. JOB SOURCES</text>
    <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Greenhouse &amp; Lever</text>
    <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Ashby &amp; Workday</text>
    <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Y-Combinator / a16z</text>
    <text x="18" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Hacker News Hiring</text>
  </g>

  <!-- CARD 2: Scanner & Dedup -->
  <g transform="translate(260, 100)">
    <rect width="170" height="120" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="28" rx="10" fill="#1e293b" opacity="0.6"/>
    <text x="85" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8">⚡ 2. SCAN &amp; DEDUP</text>
    <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ De-duplicate URLs</text>
    <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ Detect Reposts</text>
    <text x="15" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ Stale / Ghost Filter</text>
    <text x="15" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Raw clean JD queue</text>
  </g>

  <!-- CARD 3: AI Matching Engine -->
  <g transform="translate(490, 85)">
    <rect width="195" height="150" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="30" rx="12" fill="#2e1065" opacity="0.8"/>
    <text x="97" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">🧠 3. AI EVALUATION</text>
    <text x="15" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Google Gemini Flash/Pro</text>
    <text x="15" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Anthropic Claude 3.7</text>
    <text x="15" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• OpenAI / OpenRouter</text>
    <text x="15" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">• Local Ollama (Offline)</text>
    <rect x="15" y="123" width="165" height="18" rx="4" fill="#581c87"/>
    <text x="97" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f3e8ff">1–5 SCORING MATRIX</text>
  </g>

  <!-- CANDIDATE PROFILE (Input to Engine) -->
  <g transform="translate(505, 310)">
    <rect width="165" height="60" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">👤 CANDIDATE PROFILE</text>
    <text x="82" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a78bfa">profile.yml &amp; Experience Base</text>
  </g>

  <!-- BRANCH A: Reject / Low Fit -->
  <g transform="translate(260, 310)">
    <rect width="180" height="80" rx="10" fill="#2a1215" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fb7185">🚫 SCORE 1–2: DO NOT APPLY</text>
    <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecdd3">• High skill &amp; seniority gap</text>
    <text x="15" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fecdd3">• Ghost posting / Red flags</text>
    <text x="15" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f43f5e">→ Saves 100+ wasted hours</text>
  </g>

  <!-- CARD 4: High Match & Tailoring -->
  <g transform="translate(740, 95)">
    <rect width="180" height="125" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#064e3b" opacity="0.8"/>
    <text x="90" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">🎯 SCORE 3–5: APPLY</text>
    <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">✓ A–H Evaluation Report</text>
    <text x="15" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">✓ ATS Resume Tailoring</text>
    <text x="15" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#d1fae5">✓ Target Cover Letter</text>
    <text x="15" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6ee7b7">✓ LaTeX / PDF Render</text>
  </g>

  <!-- CARD 5: Pipeline Tracker -->
  <g transform="translate(740, 290)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#164e63" opacity="0.8"/>
    <text x="90" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#67e8f9">📊 5. PIPELINE TRACKER</text>
    <text x="15" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cffafe">• Application Status Sync</text>
    <text x="15" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cffafe">• Rejection Latency Track</text>
    <text x="15" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cffafe">• Follow-up Reminders</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="430" width="880" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="480" y="451" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
    🔒 100% Local-First Engine &nbsp;•&nbsp; No Third-Party Telemetry &nbsp;•&nbsp; Built for High-Signal Job Search
  </text>
</svg>
